# Lotse, run locally:     make up      (or: docker compose up -d --build)
# With demo shop:         make demo    (also starts dockware/play on http://localhost:8888)
name: lotse

services:
  lotse:
    image: ${LOTSE_IMAGE:-ghcr.io/coding9gmbh/lotse:latest}
    build:
      context: .
      args:
        VERSION: ${LOTSE_VERSION:-dev}
    container_name: lotse
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      LOTSE_BIND: 127.0.0.1
    # Docker publishes the port on 127.0.0.1 only → Lotse is reachable from the local machine only
    ports:
      - "127.0.0.1:${LOTSE_PORT:-3333}:3333"
    volumes:
      - lotse-data:/data           # SQLite DB, encrypted credentials, Claude sessions, image staging
    # Hardening: read-only file system, no root privileges, no Linux capabilities, resource limits
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /app/.next/cache:size=64m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 512
    mem_limit: 2g
    cpus: 2
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Shop on the host reachable as http://host.docker.internal:<port>
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Optional demo shop (only with --profile demo). Not for production.
  shopware:
    profiles: [demo]
    image: dockware/play:latest
    container_name: lotse-demo-shop
    ports:
      - "127.0.0.1:${DEMO_SHOP_PORT:-8888}:80"
    environment:
      XDEBUG_ENABLED: 0

volumes:
  lotse-data:
