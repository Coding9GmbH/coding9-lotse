# Dependabot: weekly update PRs for npm, GitHub Actions and the Docker base image.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Minor/patch grouped into one PR, major updates separately (they usually need manual work)
      npm-minor-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'

  # Dockerfile (base image node:*-bookworm-slim). Note: Dependabot only evaluates fixed
  # FROM lines; images assembled via ARG may not be detected.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'chore(docker)'
