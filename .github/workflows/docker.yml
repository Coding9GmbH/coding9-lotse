name: Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # The image is published automatically on a v* tag, otherwise only manually (Actions → Docker-Image → Run workflow)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/coding9gmbh/lotse

# Third-party actions are pinned by commit SHA (comment = version); Dependabot keeps them up to date.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Abhängigkeiten prüfen (npm audit, nur Laufzeit; bricht erst ab high/critical ab)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: OpenMage-Modul (Unit, ohne Shop)
        run: php integrations/openmage/tests/unit.php
      # Build + smoke test also run on PRs: build errors (e.g. server/client boundaries) would
      # otherwise only surface after the merge. The smoke test only talks to localhost and needs no secrets.
      - name: Build
        run: npm run build
      - name: Smoke-Test (Standalone-Server startet, Healthcheck & Seite antworten)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          AICB_DATA="$RUNNER_TEMP/data" HOSTNAME=127.0.0.1 PORT=3333 node .next/standalone/server.js &
          for i in $(seq 1 30); do curl -fs localhost:3333/api/ping && break; sleep 1; done
          curl -fs localhost:3333/api/health
          curl -fs -o /dev/null localhost:3333/
          curl -fs -o /dev/null localhost:3333/settings

  # Release check: if the version in package.json is bumped, package-lock.json must follow and CHANGELOG.md must have the matching section (see CONTRIBUTING.md). Ordinary PRs without a version change always pass.
  release-check:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - run: node .github/scripts/check-release.mjs "origin/${BASE_REF}"
        env: { BASE_REF: '${{ github.base_ref }}' }

  # End-to-end: real UI against a Shopify fake + fake AI (proposal → apply → undo, settings, knowledge base, axe)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: '1' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short
      - name: Bei GHCR anmelden
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bauen (amd64 + arm64) & veröffentlichen
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE=mirror.gcr.io/library/node
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
