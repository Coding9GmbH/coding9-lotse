name: Docker-Image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Image wird bei einem Tag v* automatisch veröffentlicht, sonst nur von Hand (Actions → Docker-Image → Run workflow)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/coding9gmbh/lotse

# Fremde Actions sind per Commit-SHA gepinnt (Kommentar = Version); Dependabot hält sie aktuell.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Abhängigkeiten prüfen (npm audit, nur Laufzeit; bricht erst ab high/critical ab)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: OpenMage-Modul (Unit, ohne Shop)
        run: php integrations/openmage/tests/unit.php
      # Build + Smoke-Test laufen auch bei PRs: Build-Fehler (z. B. Server/Client-Grenzen) fallen
      # sonst erst nach dem Merge auf. Der Smoke-Test spricht nur localhost an und braucht keine Secrets.
      - name: Build
        run: npm run build
      - name: Smoke-Test (Standalone-Server startet, Healthcheck & Seite antworten)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          AICB_DATA="$RUNNER_TEMP/data" HOSTNAME=127.0.0.1 PORT=3333 node .next/standalone/server.js &
          for i in $(seq 1 30); do curl -fs localhost:3333/api/ping && break; sleep 1; done
          curl -fs localhost:3333/api/health
          curl -fs -o /dev/null localhost:3333/
          curl -fs -o /dev/null localhost:3333/settings

  # Ende-zu-Ende: echte Oberfläche gegen Shopify-Fake + Fake-KI (Vorschlag → Anwenden → Rückgängig, Einstellungen, Wissen, axe)
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: '22', cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env: { CI: '1' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image:
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=edge,branch=main
            type=sha,format=short
      - name: Bei GHCR anmelden
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Bauen (amd64 + arm64) & veröffentlichen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_IMAGE=mirror.gcr.io/library/node
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true
